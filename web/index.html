<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ChocoboFix — railway track access planning</title>
<link rel="stylesheet" href="app.css">
</head>
<body>

<!-- ======================================================== SIGN IN ===== -->
<div id="signin" class="signin hide">
  <!-- Original artwork: an empty platform before the first train. Architectural
       geometry, pale concrete, long cool shadows, and a lot of negative space.
       No characters, no logos, no lettering. -->
  <div class="art" aria-hidden="true">
    <svg viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice" role="presentation">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"  stop-color="#eef1ef"/>
          <stop offset="60%" stop-color="#e4e9e7"/>
          <stop offset="100%" stop-color="#dbe1df"/>
        </linearGradient>
        <linearGradient id="shadow" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%"   stop-color="#c9d1cf" stop-opacity=".75"/>
          <stop offset="100%" stop-color="#c9d1cf" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="rail" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#b9c2c0"/>
          <stop offset="100%" stop-color="#9aa5a3"/>
        </linearGradient>
      </defs>

      <rect width="800" height="1000" fill="url(#sky)"/>

      <!-- far wall, with the rhythm of a station's bays -->
      <rect x="0" y="120" width="800" height="300" fill="#e8ecea"/>
      <g fill="#e1e6e4">
        <rect x="40"  y="170" width="92" height="210"/>
        <rect x="192" y="170" width="92" height="210"/>
        <rect x="344" y="170" width="92" height="210"/>
        <rect x="496" y="170" width="92" height="210"/>
        <rect x="648" y="170" width="92" height="210"/>
      </g>
      <rect x="0" y="118" width="800" height="3" fill="#d3d9d7"/>

      <!-- canopy, seen from beneath -->
      <path d="M0 60 L800 60 L800 118 L0 96 Z" fill="#dfe4e2"/>
      <g stroke="#d0d6d4" stroke-width="1">
        <line x1="0" y1="78" x2="800" y2="86"/>
        <line x1="0" y1="88" x2="800" y2="102"/>
      </g>

      <!-- columns and the long shadows they throw across the platform -->
      <g>
        <rect x="128" y="96"  width="13" height="330" fill="#d6dcda"/>
        <rect x="388" y="100" width="13" height="326" fill="#d6dcda"/>
        <rect x="648" y="104" width="13" height="322" fill="#d6dcda"/>
        <path d="M141 426 L300 500 L268 500 L141 444 Z" fill="url(#shadow)"/>
        <path d="M401 426 L560 500 L528 500 L401 444 Z" fill="url(#shadow)"/>
        <path d="M661 426 L800 496 L788 500 L661 444 Z" fill="url(#shadow)"/>
      </g>

      <!-- platform deck -->
      <rect x="0" y="420" width="800" height="250" fill="#e6eae8"/>
      <rect x="0" y="420" width="800" height="2"  fill="#d2d8d6"/>
      <!-- tactile edge strip -->
      <rect x="0" y="628" width="800" height="26" fill="#dce2e0"/>
      <g fill="#cdd5d3">
        <circle cx="30"  cy="641" r="3.2"/><circle cx="74"  cy="641" r="3.2"/>
        <circle cx="118" cy="641" r="3.2"/><circle cx="162" cy="641" r="3.2"/>
        <circle cx="206" cy="641" r="3.2"/><circle cx="250" cy="641" r="3.2"/>
        <circle cx="294" cy="641" r="3.2"/><circle cx="338" cy="641" r="3.2"/>
        <circle cx="382" cy="641" r="3.2"/><circle cx="426" cy="641" r="3.2"/>
        <circle cx="470" cy="641" r="3.2"/><circle cx="514" cy="641" r="3.2"/>
        <circle cx="558" cy="641" r="3.2"/><circle cx="602" cy="641" r="3.2"/>
        <circle cx="646" cy="641" r="3.2"/><circle cx="690" cy="641" r="3.2"/>
        <circle cx="734" cy="641" r="3.2"/><circle cx="778" cy="641" r="3.2"/>
      </g>
      <rect x="0" y="654" width="800" height="5" fill="#c6cfcd"/>

      <!-- trackbed, and the rails running out past the frame -->
      <rect x="0" y="659" width="800" height="341" fill="#d7dcda"/>
      <g opacity=".5" fill="#c3cbc9">
        <rect x="0" y="700" width="800" height="7"/>
        <rect x="0" y="760" width="800" height="7"/>
        <rect x="0" y="820" width="800" height="7"/>
        <rect x="0" y="880" width="800" height="7"/>
        <rect x="0" y="940" width="800" height="7"/>
      </g>
      <rect x="0" y="742" width="800" height="9"  fill="url(#rail)"/>
      <rect x="0" y="868" width="800" height="10" fill="url(#rail)"/>

      <!-- a single signal, unlit -->
      <rect x="712" y="470" width="5" height="160" fill="#cdd5d3"/>
      <rect x="702" y="446" width="25" height="46" rx="5" fill="#dbe1df" stroke="#c7cfcd"/>
      <circle cx="714.5" cy="459" r="6" fill="#cfd6d4"/>
      <circle cx="714.5" cy="477" r="6" fill="#cfd6d4"/>
    </svg>
  </div>

  <div class="panel">
    <div class="inner">
      <h1>TrackAccess</h1>
      <p class="lede" data-i18n="signin_lede">Plan which work gets the track, on which nights — and check the answer before anyone acts on it.</p>

      <form id="signinForm" novalidate>
        <div class="field">
          <label for="su" data-i18n="username">Username</label>
          <input type="text" id="su" autocomplete="username" autocapitalize="none" spellcheck="false"
                 required aria-describedby="suErr">
          <p class="small field-err" id="suErr" role="alert"></p>
        </div>
        <div class="field">
          <label for="sp" data-i18n="password">Password</label>
          <input type="password" id="sp" autocomplete="current-password" required aria-describedby="spErr">
          <p class="small field-err" id="spErr" role="alert"></p>
        </div>
        <div id="signinMsg" role="alert" aria-live="polite"></div>
        <div class="row" style="margin-top:16px">
          <button type="submit" class="btn btn-primary" id="signinGo" data-i18n="signin">Sign in</button>
          <button type="button" class="btn" id="trySample" data-i18n="try_sample">Try sample project</button>
        </div>
      </form>

      <div class="foot">
        <div class="row tight" style="justify-content:space-between">
          <span>
            <label for="langSignin" class="sr-only">Language</label>
            <select id="langSignin" class="lang-select"></select>
          </span>
          <button type="button" class="btn-quiet btn btn-sm" id="signinHelp" data-i18n="help">Help</button>
        </div>
        <p class="small" style="margin:12px 0 0" id="signinNote" data-i18n="signin_note">Accounts are created by an administrator. There is no self-registration, and no password is ever sent by email.</p>
      </div>
    </div>
  </div>
</div>

<!-- ======================================================== APP ========= -->
<div id="app" class="app hide">
  <header class="topbar">
    <div class="brand">
      <span class="name">TrackAccess</span>
    </div>
    <div class="context" id="ctx"></div>
    <div class="spacer"></div>
    <label for="langSel" class="sr-only">Language</label>
    <select id="langSel" class="lang-select" style="width:auto"></select>
    <label for="sizeSel" class="sr-only">Text size</label>
    <select id="sizeSel" style="width:auto">
      <option value="14">A−</option><option value="15" selected>A</option>
      <option value="17">A+</option><option value="19">A++</option>
    </select>
    <button class="btn btn-sm" id="helpBtn" data-i18n="help">Help</button>
    <button class="btn btn-sm" id="acctBtn" aria-haspopup="menu" aria-expanded="false"></button>
  </header>

  <nav class="nav" id="nav" aria-label="Sections">
    <button data-view="projects"   data-i18n="nav_projects">Projects</button>
    <button data-view="overview"   data-i18n="nav_overview" disabled>Overview</button>
    <button data-view="schedule"   data-i18n="nav_schedule" disabled>Schedule</button>
    <button data-view="activities" data-i18n="nav_activities" disabled>Activities</button>
    <button data-view="history"    data-i18n="nav_history" disabled>History</button>
    <button data-view="settings"   data-i18n="nav_settings">Settings</button>
  </nav>

  <main class="main" id="main">
    <div id="view" aria-live="polite"></div>
  </main>
</div>

<div id="dialogHost"></div>

<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
