name: code-scanning

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: codeql-${{ matrix.language }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, c-cpp]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/codeql-config.yml
      - name: Install native prerequisites
        if: matrix.language == 'c-cpp'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential cmake curl ca-certificates libsqlite3-dev libssl-dev
          ./scripts/fetch_deps.sh
      - name: Build native service
        if: matrix.language == 'c-cpp'
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j2 --target trackaccess trackaccess-service test_core test_store
      - name: Install and build frontend
        if: matrix.language == 'javascript-typescript'
        run: |
          npm ci --prefix client --no-audit --no-fund
          npm run build --prefix client
      - uses: github/codeql-action/analyze@v4
