name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "21 3 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyse:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: c-cpp,javascript-typescript
          build-mode: manual
      - name: Install native prerequisites
        run: sudo apt-get update -qq && sudo apt-get install -y -qq build-essential cmake curl ca-certificates libsqlite3-dev libssl-dev
      - run: ./scripts/fetch_deps.sh
      - run: cmake -S . -B build-codeql -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build-codeql -j2
      - uses: github/codeql-action/analyze@v3
