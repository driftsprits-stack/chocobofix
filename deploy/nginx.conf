# TLS-terminating reverse proxy for TrackAccess (nginx equivalent of the Caddyfile).
# Certificates from certbot; see docs/DEPLOYMENT.md for the renewal note.

server {
    listen 80;
    server_name trackaccess.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name trackaccess.example.org;

    ssl_certificate     /etc/letsencrypt/live/trackaccess.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trackaccess.example.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    server_tokens off;

    # Matches the service's own cap, so an oversized upload is refused at the edge.
    client_max_body_size 32m;

    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # A solve can occupy a request for as long as its budget allows.
        proxy_read_timeout 180s;
    }
}
